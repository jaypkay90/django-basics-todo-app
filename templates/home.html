<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO LIST - Home</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js" integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN" crossorigin="anonymous"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    
    <style>
        .form-control{
        padding: 1.375rem .75rem !important;
    }
    </style>
</head>
<body>
    <div class="container">
        <h3 class="pt-5 text-center">Django ToDo App</h3>
        <div class="row">
            <h4>My Day</h4>

            <!-- Load current Date dynamically -->
            <p class="text-muted">{% now "jS F Y" %}</p> 
            <div class="col-md-7 col-lg-7" style="height: 450px; overflow: scroll;">

                <!-- List of all the tasks for the day -->
                {% for task in tasks %}
                    <div class="card m-1">
                        <div class="card-body">
                            {{ task.task }}
                            <span style="position: relative; float: right; display: flex; gap: 5px;">
                                <!-- Alles, was unmittelbar zu Datenänderungen führt, sollte mit POST-Requests gesendet werden.
                                Weitere Infos in todo/views.py -->
                                <form action="{% url 'completeTask' task.pk %}" method="POST">
                                    
                                    <!-- CSRF = Cross-Site Request Forgery -> Cyberangriffstechnik, bei dem der Angreifer versucht, einen Request an eine andere Webseite zu senden, 
                                    um dort unerwünschte Aktionen durchzuführen
                                    Beispiel: Angreifer baut eine harmlos aussehende Webseite, die eine Form enthält, deren action Attribut auf eine andere Webseite verweist und 
                                    dort schaden anrichten:
                                    <form method="post" action="https://deine-app.com/deleteTask/1">
                                        <input type="submit" value="Click me!">
                                    </form> -->
                                    {% csrf_token %}
                                    <button class="btn btn-success"><i class="fa fa-check"></i> Mark as Done</button>
                                </form>
                                <form action="{% url 'deleteTask' task.pk %}" method="POST">
                                    {% csrf_token %}
                                    <button class="btn btn-danger"><i class="fa fa-trash"></i></button>
                                </form>
                                <a class="btn btn-primary" href="{% url 'editTask' task.pk %}"><i class="fa fa-pencil"></i></a>
                            </span>
                        </div>
                    </div>
               {% endfor %}

            </div>
            <div class="col-md-5 col-lg-5">
                <h5>Completed Tasks</h5>
                <!-- List of all the tasks that have completed -->
                
                {% for task in completed_tasks %}
                    <div class="card m-1">
                        <div class="card-body">
                            {{ task.task }}
                            <span style="position: relative; float: right; display: flex;">
                                <form action="{% url 'markTaskUndone' task.pk %}" method="POST">
                                    {% csrf_token %}
                                    <button class="btn btn-warning"><i class="fa fa-times"></i> Mark as Undone</button>
                                </form>
                            </span>
                        </div>
                    </div>
                {% endfor %}

            </div>
        </div>
        <div class="row">
            <div class="col-md-6 col-lg-6 p-0" style="position: absolute; bottom: 50px;">
                <!-- To Do Form -->
                <form action="{% url 'addTask' %}" method="POST">
                    {% csrf_token %}
                    <div class="form-group">
                        <span style="display: flex;">
                            <input type="text" name="task" class="form-control" placeholder="Add a task">
                            <button class="btn btn-primary" style="width: 200px;" type="submit"><i class="fa fa-plus"></i> Add</button>
                        </span>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
